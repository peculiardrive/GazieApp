<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2A4E"/>
      <stop offset="100%" stop-color="#14213D"/>
    </radialGradient>
    <pattern id="perf" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.4" fill="#FBF7EE" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="390" height="844" fill="url(#glow)"/>
  <rect width="390" height="844" fill="url(#perf)"/>

  <!-- ticket outline mark -->
  <g transform="translate(105,300)">
    <rect x="0" y="0" width="180" height="110" rx="10" fill="#FFC93C" stroke="#14213D" stroke-width="3"/>
    <!-- perforation between stub sections -->
    <line x1="130" y1="6" x2="130" y2="104" stroke="#14213D" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <!-- route arrow -->
    <text x="20" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#14213D">LUGBE</text>
    <path d="M62 42 L82 42 M78 38 L82 42 L78 46" stroke="#14213D" stroke-width="2" fill="none"/>
    <text x="88" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#14213D">CBD</text>
    <text x="20" y="62" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#14213D" opacity="0.7">GC-0001 · VERIFIED</text>
    <!-- tear tab -->
    <text x="145" y="48" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="15" fill="#14213D">₦50</text>
    <text x="140" y="64" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#14213D" opacity="0.6">GAZIE FEE</text>
    <!-- perforation dots along edge -->
    <circle cx="0" cy="20" r="4" fill="#14213D"/>
    <circle cx="0" cy="90" r="4" fill="#14213D"/>
    <circle cx="180" cy="20" r="4" fill="#14213D"/>
    <circle cx="180" cy="90" r="4" fill="#14213D"/>
  </g>

  <!-- wordmark -->
  <text x="195" y="470" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#FBF7EE">Gazie Commute</text>
  <text x="195" y="498" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#FFC93C" letter-spacing="1.5">VERIFIED RIDES. TRUSTED ROUTES.</text>

  <!-- loading dots -->
  <g transform="translate(195,560)">
    <circle cx="-16" cy="0" r="4" fill="#FFC93C"/>
    <circle cx="0" cy="0" r="4" fill="#FFC93C" opacity="0.6"/>
    <circle cx="16" cy="0" r="4" fill="#FFC93C" opacity="0.3"/>
  </g>

  <text x="195" y="800" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#FBF7EE" opacity="0.5">Lugbe · Abuja</text>
</svg>
